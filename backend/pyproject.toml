[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "google-generativeai>=0.8.5",
    "llama-index>=0.10.0",
    "llama-index-core>=0.10.0",
    "langfuse>=2.0.0",
    "mistral>=21.0.0",
    "mistralai>=1.12.0",
    "openai>=1.10.0",
    "pgvector>=0.4.0",
    "psycopg2-binary>=2.9.9",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.6.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.25",
    "supabase>=2.28.0",
    "uvicorn>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rules for the version pinned in uv.lock (PCR-0012). Leave `select` unset.

# Baseline: rules each file broke when ruff was turned on. Shrink this, never grow it.
[tool.ruff.lint.per-file-ignores]
"src/agents/__init__.py" = ["F401", "I001"]
"src/agents/base.py" = ["I001"]
"src/agents/document_agent.py" = ["F841", "G201", "I001"]
"src/agents/law_agent.py" = ["F841", "G201", "I001"]
"src/agents/orchestrator.py" = ["UP006", "UP035"]
"src/chunking/chunk_detaljplan.py" = ["LOG015", "SIM103"]
"src/chunking/embed.py" = ["BLE001", "DTZ005", "F841", "G201", "I001"]
"src/chunking/ingest_data_folder.py" = ["I001"]
"src/chunking/ingest_laws.py" = ["I001"]
"src/chunking/ingest_pipeline.py" = ["I001"]
"src/db/push_db.py" = ["F401", "I001", "RET501"]
"src/db/run_match_functions.py" = ["I001"]
"src/dependencies.py" = ["B008", "I001"]
"src/llm.py" = ["UP035"]
"src/main.py" = ["I001"]
"src/models.py" = ["F401", "I001"]
"src/observability.py" = ["I001"]
"src/ocr/create_markdown.py" = ["F841", "G201", "I001", "LOG015"]
"src/routers/__init__.py" = ["F401"]
