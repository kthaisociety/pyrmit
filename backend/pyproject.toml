[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "google-generativeai>=0.8.5",
    "llama-index>=0.10.0",
    "llama-index-core>=0.10.0",
    "langfuse>=2.0.0",
    "mistral>=21.0.0",
    "mistralai>=1.12.0",
    "numpy>=1.26.0",
    "openai>=1.10.0",
    "pgvector>=0.4.0",
    "psycopg2-binary>=2.9.9",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.6.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.25",
    "supabase>=2.28.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
# Local RAG: offline corpus (crawl, PDF extraction), local embedding models (EMBEDDING_PROVIDER=st),
# Swedish BM25. Install with: uv pip install -e ".[local]" (+ torch with CUDA from download.pytorch.org)
local = [
    "sentence-transformers>=3.0.0",
    "onnxruntime>=1.20.0",  # CPU embeddings (ONNX int8) when there is no GPU
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "pymupdf>=1.24.0",
    "trafilatura>=1.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]
