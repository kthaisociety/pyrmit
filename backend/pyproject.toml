[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "bm25s>=0.2.0",  # the local corpus: Swedish BM25 (memory store)
    "cryptography>=44.0.0",  # Fernet: users' own API keys, encrypted under API_KEY_ENCRYPTION_KEY (user_keys.py)
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.5",
    "llama-index>=0.10.0",
    "llama-index-core>=0.10.0",
    "langfuse>=2.0.0",
    "mistral>=21.0.0",
    "mistralai>=1.12.0",
    "numpy>=1.26.0",
    "openai>=1.10.0",
    "pgvector>=0.4.0",
    "pymupdf>=1.24.0",  # cited PDFs at the passage, map crops for the agent
    "psycopg2-binary>=2.9.9",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.6.0",
    "pyjwt>=2.8.0",
    "PyStemmer>=2.2.0",  # Swedish stems of the BM25 queries
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "shapely>=2.0",  # the place lookup: plan polygons, snapshots, STRtree
    "sqlalchemy>=2.0.25,<2.1",  # 2.1 makes postgresql:// use psycopg 3, which is not installed
    "supabase>=2.28.0",
    "truststore>=0.10.0",  # TLS with the OS certificate store: crawler and PDF downloads
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
# The offline corpus steps (crawl, extraction, PDF filter, OCR benchmark scoring). CI installs it for their tests.
corpus = [
    "httpx[http2]>=0.27.0",  # the crawler uses HTTP/2
    "lxml>=5.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.5.0",
    "trafilatura>=1.12.0",
]
# Local embedding models (EMBEDDING_PROVIDER=st, LOCAL_RAG_MODEL=st-*). Pulls torch, so CI leaves it out: install torch
# with CUDA first (uv pip install torch --index-url https://download.pytorch.org/whl/cu128), then uv sync --extra local
local = [
    "onnxruntime>=1.20.0",  # CPU embeddings (ONNX int8) when there is no GPU
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# uv sync installs the backend in editable mode with backend/src on the path, so `python -m corpus.crawl` and the other
# commands run from backend/ as before the src layout. Docker skips it (--no-install-project) and sets PYTHONPATH.
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." for helpers shared between test files (tests.unit.place.snapshot)
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rules for the version pinned in uv.lock (PCR-0012). Leave `select` unset.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers in parameter defaults are the framework's idiom, not a shared mutable default (B008)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body"]

# Baseline: rules each file broke when ruff was turned on. Shrink this, never grow it.
[tool.ruff.lint.per-file-ignores]
"src/agents/__init__.py" = ["F401", "I001"]
"src/agents/base.py" = ["I001"]
"src/agents/document_agent.py" = ["F841", "G201", "I001"]
"src/agents/law_agent.py" = ["F841", "G201", "I001"]
"src/agents/orchestrator.py" = ["UP006", "UP035"]
"src/chunking/chunk_detaljplan.py" = ["LOG015", "SIM103"]
"src/chunking/embed.py" = ["BLE001", "DTZ005", "F841", "G201", "I001"]
"src/chunking/ingest_data_folder.py" = ["I001"]
"src/chunking/ingest_laws.py" = ["I001"]
"src/chunking/ingest_pipeline.py" = ["I001"]
"src/db/push_db.py" = ["F401", "I001", "RET501"]
"src/db/run_match_functions.py" = ["I001"]
"src/dependencies.py" = ["I001"]
"src/llm.py" = ["UP035"]
"src/main.py" = ["I001"]
"src/models.py" = ["F401", "I001"]
"src/observability.py" = ["I001"]
"src/ocr/create_markdown.py" = ["F841", "G201", "I001", "LOG015"]
"src/routers/__init__.py" = ["F401"]
"src/routers/agents.py" = ["F811", "I001"]
"src/routers/auth.py" = ["I001"]
"src/routers/chat.py" = ["F401", "G201", "I001", "UP035", "UP043"]
"src/routers/chunks.py" = ["BLE001", "I001"]
"src/routers/queryDB.py" = ["N999"]
"src/security.py" = ["I001"]
"tests/unit/agents/test_agents.py" = ["I001", "SIM117"]
